<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="app.css">
    <title>Convert PDF to WORD</title>
</head>
<body>

    <div class="main-container">

        <form
            action="/upload"
            method="POST"
            enctype="multipart/form-data"
        >

            <label for="file-input" class="custom-input">
                Upload PDF
            </label>

            <input
                type="file"
                id="file-input"
                class="file-upload"
                name="pdf"
                accept="application/pdf"
                required
            >

            <button type="submit">
                Convert to Word
            </button>

        </form>

    </div>

</body>
</html>
